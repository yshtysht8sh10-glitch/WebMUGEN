<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="webmugen-matrix-revision" content="2026-08-22-issue-136-button-hold-priority">
<title>WebMUGEN WinMUGEN Compatibility Matrix</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--head:#172033;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--link:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:1480px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:34px 0 12px}.lead,.foot{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:8px}.toolbar button,.toolbar input,.toolbar select{background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px}.toolbar button.active{border-color:var(--link)}.toolbar input{min-width:260px;flex:1}.summary{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.card b{font-size:24px}.card span{display:block;color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}th{background:var(--head);color:#cbd5e1;font-size:13px}td{font-size:14px}.item{font-family:ui-monospace,monospace;white-space:nowrap}.note{color:#cbd5e1;min-width:440px}.pill{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}.complete{background:#16633433;color:#86efac}.partial{background:#0284c733;color:#7dd3fc}.fallback{background:#9333ea33;color:#d8b4fe}.safe-noop{background:#64748b40;color:#cbd5e1}.issue-ready{background:#ca8a0438;color:#fde68a}.not-started{background:#dc262e2e;color:#fecaca}.audit-needed,.not-applicable{border:1px dashed #94a3b8;color:#e2e8f0}.progress{display:inline-block;width:72px;height:5px;margin-left:7px;border-radius:999px;background:#334155;overflow:hidden;vertical-align:middle}.progress i{display:block;height:100%;background:currentColor}.error{margin:20px 0;padding:12px;border:1px solid #ef4444;border-radius:8px;color:#fecaca}@media(max-width:760px){.wrap{padding:14px}.summary{grid-template-columns:1fr 1fr}.toolbar input{min-width:100%}.item{white-space:normal}}
</style></head>
<body><div class="wrap"><header>
<h1 id="title">WebMUGEN WinMUGEN 互換対応表</h1><p class="lead" id="lead">実装状況を分類し、一部実装には互換完成度を表示します。</p>
<div class="toolbar"><button id="ja" class="active">日本語</button><button id="en">English</button><input id="q" type="search" placeholder="検索 / Search"><select id="status"><option value="all">全ステータス</option></select><select id="section"><option value="all">全カテゴリ</option></select></div>
</header><section class="summary" id="summary"></section><main id="tables"><p>Loading…</p></main><p class="foot" id="foot">運用ルール: 実装やテストを追加したら、HTMLとMarkdownの互換表を同時に更新する。</p></div>
<script>
'use strict';
const statusMap={complete:{ja:'完了',en:'Complete'},partial:{ja:'一部完了',en:'Partial'},fallback:{ja:'代替実装',en:'Fallback'},'safe-noop':{ja:'safe no-op',en:'Safe no-op'},'issue-ready':{ja:'Issue書き出し済み',en:'Issue ready'},'not-started':{ja:'未着手',en:'Not started'},'audit-needed':{ja:'要監査',en:'Audit needed'},'not-applicable':{ja:'対象外',en:'Not applicable'}};
const sectionNames={statedef:['Statedef / 共通State','Statedef / Common States'],headers:['StateDef Header','StateDef Headers'],controllers:['State Controller','State Controllers'],hitdefparams:['HitDef補助パラメータ','HitDef Auxiliary Parameters'],triggers:['Trigger','Triggers'],redirects:['Redirect / Player参照','Redirects / Player References'],expressions:['Expression / Operator','Expressions / Operators'],cmd:['CMD互換','CMD Compatibility']};
let lang='ja',sections=[];
const localizedRemarks={};
function localizedText(values,requested=lang){return values[requested]||values.en||''}
function splitRow(line){const a=[];let c='',code=false;for(let i=1;i<line.length-1;i++){const ch=line[i];if(ch==='`')code=!code;if(ch==='|'&&!code){a.push(c.trim());c=''}else c+=ch}a.push(c.trim());return a}
function kindOf(s){let m;if(s==='Complete')return['complete',100];if((m=s.match(/^Partial (\d+)%$/)))return['partial',+m[1]];if((m=s.match(/^Fallback (\d+)%$/)))return['fallback',+m[1]];const map={'Safe no-op':'safe-noop','Issue ready':'issue-ready','Not started':'not-started','Audit needed':'audit-needed','Not applicable':'not-applicable'};return map[s]?[map[s],null]:null}
function jaNote(s){if(!s)return'';const rules=[[/^Implemented:\s*/,'実装済み: '],[/\bMissing:\s*/g,' 未対応: '],[/\bEvidence:\s*/g,' 根拠: '],[/\bPending\b/g,'未完了'],[/\bremains? incomplete\b/gi,'は未完成です'],[/\bremain unavailable\b/gi,'は利用できません'],[/\bremains? Partial\b/g,'は一部対応です'],[/\bfocused tests?\b/gi,'focused test'],[/\breal-character confirmation\b/gi,'実キャラクター確認'],[/\breal-game\b/gi,'実ゲーム'],[/\bcurrent implementation\b/gi,'現行実装'],[/\bruntime\b/gi,'ランタイム'],[/\bplayer\b/gi,'プレイヤー'],[/\bcharacter\b/gi,'キャラクター'],[/\bowner(ship)?\b/gi,'所有者'],[/\bredirect(s)?\b/gi,'Redirect'],[/\bunsupported\b/gi,'未対応'],[/\bimplemented\b/gi,'実装済み'],[/\buses\b/gi,'使用します'],[/\breads\b/gi,'参照します'],[/\breturns\b/gi,'返します'],[/\bcounts\b/gi,'数えます'],[/\bsupports\b/gi,'対応します'],[/\bwith\b/gi,'（'],[/\band\b/gi,'および'],[/\bbut\b/gi,'ただし'],[/\bfor\b/gi,'対象:'],[/\bthe\b/gi,''],[/\bcurrent\b/gi,'現在の'],[/\bproduction\b/gi,'本番経路'],[/\bfocused\b/gi,'重点'],[/\btest(s)?\b/gi,'テスト']];let out=s;for(const[r,v]of rules)out=out.replace(r,v);return out.replace(/\s{2,}/g,' ').trim()}
function parse(md){const ids=['statedef','headers','controllers','hitdefparams','triggers','redirects','expressions','cmd'];const out=[];let cur=null,idx=0;for(const line of md.split(/\r?\n/)){const h=line.match(/^##\s+(.+)/);if(h){const id=ids[idx++]||`section-${idx}`;cur={id,ja:sectionNames[id]?.[0]||h[1],en:sectionNames[id]?.[1]||h[1],rows:[]};out.push(cur);continue}if(!cur||!line.startsWith('|')||/^\|[-: |]+\|$/.test(line))continue;const c=splitRow(line);if(c.length<3||/^(Item|項目)$/i.test(c[0]))continue;const kp=kindOf(c.at(-2));if(!kp)continue;const item=c[0].replaceAll('`',''),meaning=c.length===4?c[1]:'',note=c.at(-1);cur.rows.push([item,meaning,meaning,kp[0],jaNote(note),note,kp[1]])}return out.filter(s=>s.rows.length)}
function render(){const q=document.querySelector('#q').value.toLowerCase(),sf=document.querySelector('#status').value,sec=document.querySelector('#section').value,t=document.querySelector('#tables');t.innerHTML='';const counts=Object.fromEntries(Object.keys(statusMap).map(k=>[k,0]));for(const s of sections){if(sec!=='all'&&sec!==s.id)continue;const rows=s.rows.filter(r=>(!q||r.join(' ').toLowerCase().includes(q))&&(sf==='all'||r[3]===sf));if(!rows.length)continue;const h=document.createElement('h2');h.textContent=localizedText(s);t.appendChild(h);const w=document.createElement('div');w.className='table-wrap';const table=document.createElement('table');table.innerHTML=`<thead><tr><th>Item</th><th>${lang==='ja'?'内容':'Meaning'}</th><th>Status</th><th>${lang==='ja'?'備考':'Notes'}</th></tr></thead>`;const tb=document.createElement('tbody');for(const r of rows){counts[r[3]]++;const tr=document.createElement('tr'),p=r[6],bar=['partial','fallback'].includes(r[3])?`<span class="progress"><i style="width:${p}%"></i></span>`:'';tr.innerHTML=`<td class="item"></td><td></td><td><span class="pill ${r[3]}">${localizedText(statusMap[r[3]])}${p!=null&&['partial','fallback'].includes(r[3])?' '+p+'%':''}</span>${bar}</td><td class="note"></td>`;tr.children[0].textContent=r[0];tr.children[1].textContent=localizedText({ja:r[1],en:r[2]});tr.children[3].textContent=localizedText({ja:localizedRemarks[r[0]]?.ja||r[4],en:r[5]});tb.appendChild(tr)}table.appendChild(tb);w.appendChild(table);t.appendChild(w)}const sm=document.querySelector('#summary');sm.innerHTML='';for(const k of Object.keys(statusMap)){const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${counts[k]}</b><span>${localizedText(statusMap[k])}</span>`;sm.appendChild(d)}}
function setLang(x){lang=x;document.documentElement.lang=x;document.querySelector('#ja').classList.toggle('active',x==='ja');document.querySelector('#en').classList.toggle('active',x==='en');document.querySelector('#title').textContent=x==='ja'?'WebMUGEN WinMUGEN 互換対応表':'WebMUGEN WinMUGEN Compatibility Matrix';document.querySelector('#lead').textContent=x==='ja'?'実装状況を分類し、一部実装には互換完成度を表示します。':'Shows implementation status and compatibility progress.';document.querySelector('#foot').textContent=x==='ja'?'運用ルール: 実装やテストを追加したら、HTMLとMarkdownの互換表を同時に更新する。':'Maintenance rule: update both HTML and Markdown matrices when implementation or tests change.';document.querySelector('#status').options[0].text=x==='ja'?'全ステータス':'All statuses';document.querySelector('#section').options[0].text=x==='ja'?'全カテゴリ':'All categories';[...document.querySelector('#section').options].slice(1).forEach(o=>{const s=sections.find(v=>v.id===o.value);if(s)o.text=x==='ja'?s.ja:s.en});render()}
function init(){const status=document.querySelector('#status'),section=document.querySelector('#section');for(const[k,v]of Object.entries(statusMap)){const o=document.createElement('option');o.value=k;o.text=v.ja;status.appendChild(o)}for(const s of sections){const o=document.createElement('option');o.value=s.id;o.text=s.ja;section.appendChild(o)}document.querySelector('#q').oninput=render;status.onchange=render;section.onchange=render;document.querySelector('#ja').onclick=()=>setLang('ja');document.querySelector('#en').onclick=()=>setLang('en');render()}
fetch('./winmugen-compatibility-matrix.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.text()}).then(md=>{sections=parse(md);if(!sections.length)throw Error('Matrix rows could not be parsed');init()}).catch(e=>{document.querySelector('#tables').innerHTML=`<div class="error">Compatibility Matrix load failed: ${String(e.message||e)}</div>`;console.error(e)});
</script></body></html>
