<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="webmugen-matrix-revision" content="2026-09-02-stage-path-edge-fix">
<title>WebMUGEN Compatibility Matrix</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--head:#172033;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--link:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:1480px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:34px 0 12px}.lead,.inheritance,.foot{color:var(--muted)}.profile-tabs{display:flex;gap:8px;margin:20px 0 12px;border-bottom:1px solid var(--line)}.profile-tabs button{appearance:none;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}.profile-tabs button:hover{color:var(--text)}.profile-tabs button.active{color:var(--text);border-bottom-color:var(--link)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:8px}.toolbar button,.toolbar input,.toolbar select{background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px}.toolbar button.active{border-color:var(--link)}.toolbar input{min-width:260px;flex:1}.summary{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.card b{font-size:24px}.card span{display:block;color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}th{background:var(--head);color:#cbd5e1;font-size:13px}td{font-size:14px}.item{font-family:ui-monospace,monospace;white-space:nowrap}.note{color:#cbd5e1;min-width:440px}.pill{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}.complete{background:#16653433;color:#86efac}.partial{background:#0284c733;color:#7dd3fc}.fallback{background:#9333ea33;color:#d8b4fe}.safe-noop{background:#64748b40;color:#cbd5e1}.issue-ready{background:#ca8a0438;color:#fde68a}.not-started{background:#dc262e2e;color:#fecaca}.audit-needed,.not-applicable{border:1px dashed #94a3b8;color:#e2e8f0}.progress{display:inline-block;width:72px;height:5px;margin-left:7px;border-radius:999px;background:#334155;overflow:hidden;vertical-align:middle}.progress i{display:block;height:100%;background:currentColor}.error{margin:20px 0;padding:12px;border:1px solid #ef4444;border-radius:8px;color:#fecaca}@media(max-width:760px){.wrap{padding:14px}.summary{grid-template-columns:1fr 1fr}.profile-tabs{overflow-x:auto}.profile-tabs button{white-space:nowrap}.toolbar input{min-width:100%}.item{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 id="title">WebMUGEN Compatibility Matrix</h1>
<p class="lead" id="lead"></p>
<p class="inheritance" id="inheritance"></p>
<nav class="profile-tabs" id="profile-tabs" aria-label="Compatibility profile"></nav>
<div class="toolbar"><button id="ja" class="active">日本語</button><button id="en">English</button><input id="q" type="search" placeholder="検索 / Search"><select id="status"><option value="all">全ステータス</option></select><select id="section"><option value="all">全カテゴリ</option></select></div>
</header>
<section class="summary" id="summary"></section>
<main id="tables"><p>Loading…</p></main>
<p class="foot" id="foot"></p>
</div>
<script>
'use strict';
const statusMap={complete:{ja:'完了',en:'Complete'},partial:{ja:'一部完了',en:'Partial'},fallback:{ja:'代替実装',en:'Fallback'},'safe-noop':{ja:'safe no-op',en:'Safe no-op'},'issue-ready':{ja:'Issue書き出し済み',en:'Issue ready'},'not-started':{ja:'未着手',en:'Not started'},'audit-needed':{ja:'要監査',en:'Audit needed'},'not-applicable':{ja:'対象外',en:'Not applicable'}};
const matrixProfiles={
  winmugen:{label:'WinMUGEN',source:'./winmugen-compatibility-matrix.md',relation:{ja:'Canonical（正本）: WinMUGENの全互換項目を表示します。',en:'Canonical: shows the complete WinMUGEN compatibility inventory.'}},
  mugen10:{label:'MUGEN 1.0',source:'./mugen10-compatibility-delta.md',relation:{ja:'差分: WinMUGENから追加・変更された項目のみを表示します。',en:'Delta: shows only additions and changes relative to WinMUGEN.'}},
  mugen11:{label:'MUGEN 1.1',source:'./mugen11-compatibility-delta.md',relation:{ja:'差分: MUGEN 1.0から追加・変更された項目のみを表示します。',en:'Delta: shows only additions and changes relative to MUGEN 1.0.'}}
};
const sectionTranslations={'StateDef Compatibility':'StateDef / 共通State','StateDef Header Fields':'StateDef Header','State Controller Compatibility':'State Controller','HitDef Auxiliary Parameter Compatibility':'HitDef補助パラメータ','Trigger Compatibility':'Trigger','Redirects / Player References':'Redirect / Player参照','Expression / Operator Support':'Expression / Operator','CMD Compatibility':'CMD互換','Loader Compatibility':'Loader互換','Character / Profile':'キャラクター / Profile','Constants':'定数','Triggers / Expressions':'Trigger / Expression','State Controllers':'State Controller','Resources / SFF v2.0':'Resource / SFF v2.0','Resources / SFF v2.01':'Resource / SFF v2.01','Engine Differences':'Engine差分','Camera / Rendering':'Camera / Rendering','Explod Differences':'Explod差分'};
let lang='ja',activeProfile='winmugen',sections=[];
const matrixCache=new Map(),localizedRemarks={};
function localizedText(values,requested=lang){return values[requested]||values.en||''}
function splitRow(line){const cells=[];let cell='',code=false;for(let i=1;i<line.length-1;i++){const ch=line[i];if(ch==='`')code=!code;if(ch==='|'&&!code){cells.push(cell.trim());cell=''}else cell+=ch}cells.push(cell.trim());return cells}
function kindOf(status){let match;if(status==='Complete')return['complete',100];if((match=status.match(/^Partial (\d+)%$/)))return['partial',+match[1]];if((match=status.match(/^Fallback (\d+)%$/)))return['fallback',+match[1]];const map={'Safe no-op':'safe-noop','Issue ready':'issue-ready','Not started':'not-started','Audit needed':'audit-needed','Not applicable':'not-applicable'};return map[status]?[map[status],null]:null}
function jaNote(s){if(!s)return'';const rules=[[/^Implemented:\s*/,'実装済み: '],[/\bMissing:\s*/g,' 未対応: '],[/\bEvidence:\s*/g,' 根拠: '],[/\bPending\b/g,'未完了'],[/\bremains? incomplete\b/gi,'は未完成です'],[/\bremain unavailable\b/gi,'は利用できません'],[/\bremains? Partial\b/g,'は一部対応です'],[/\bfocused tests?\b/gi,'focused test'],[/\breal-character confirmation\b/gi,'実キャラクター確認'],[/\breal-game\b/gi,'実ゲーム'],[/\bcurrent implementation\b/gi,'現行実装'],[/\bruntime\b/gi,'ランタイム'],[/\bplayer\b/gi,'プレイヤー'],[/\bcharacter\b/gi,'キャラクター'],[/\bowner(ship)?\b/gi,'所有者'],[/\bredirect(s)?\b/gi,'Redirect'],[/\bunsupported\b/gi,'未対応'],[/\bimplemented\b/gi,'実装済み'],[/\buses\b/gi,'使用します'],[/\breads\b/gi,'参照します'],[/\breturns\b/gi,'返します'],[/\bcounts\b/gi,'数えます'],[/\bsupports\b/gi,'対応します'],[/\bwith\b/gi,'（'],[/\band\b/gi,'および'],[/\bbut\b/gi,'ただし'],[/\bfor\b/gi,'対象:'],[/\bthe\b/gi,''],[/\bcurrent\b/gi,'現在の'],[/\bproduction\b/gi,'本番経路'],[/\bfocused\b/gi,'重点'],[/\btest(s)?\b/gi,'テスト']];let out=s;for(const[r,v]of rules)out=out.replace(r,v);return out.replace(/\s{2,}/g,' ').trim()}
function parse(markdown){const output=[];let section=null,index=0;for(const line of markdown.split(/\r?\n/)){const heading=line.match(/^##\s+(.+)/);if(heading){if(heading[1]==='Status Legend')continue;section={id:`section-${index++}`,ja:sectionTranslations[heading[1]]||heading[1],en:heading[1],rows:[]};output.push(section);continue}if(!section||!line.startsWith('|')||/^\|[-: |]+\|$/.test(line))continue;const cells=splitRow(line);if(cells.length<3||/^(Item|項目)$/i.test(cells[0]))continue;const status=kindOf(cells.at(-2));if(!status)continue;const item=cells[0].replaceAll('`',''),meaning=cells.length===4?cells[1]:'',note=cells.at(-1);section.rows.push([item,meaning,meaning,status[0],jaNote(note),note,status[1]])}return output.filter(entry=>entry.rows.length)}
function rebuildSectionFilter(){const select=document.querySelector('#section'),selected=select.value;select.replaceChildren(new Option(lang==='ja'?'全カテゴリ':'All categories','all'));for(const section of sections)select.add(new Option(localizedText(section),section.id));if([...select.options].some(option=>option.value===selected))select.value=selected}
function render(){const query=document.querySelector('#q').value.toLowerCase(),statusFilter=document.querySelector('#status').value,sectionFilter=document.querySelector('#section').value,tables=document.querySelector('#tables');tables.innerHTML='';const counts=Object.fromEntries(Object.keys(statusMap).map(key=>[key,0]));for(const section of sections){if(sectionFilter!=='all'&&sectionFilter!==section.id)continue;const rows=section.rows.filter(row=>(!query||row.join(' ').toLowerCase().includes(query))&&(statusFilter==='all'||row[3]===statusFilter));if(!rows.length)continue;const heading=document.createElement('h2');heading.textContent=localizedText(section);tables.appendChild(heading);const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');table.innerHTML=`<thead><tr><th>Item</th><th>${lang==='ja'?'内容':'Meaning'}</th><th>Status</th><th>${lang==='ja'?'備考':'Notes'}</th></tr></thead>`;const body=document.createElement('tbody');for(const row of rows){counts[row[3]]++;const tr=document.createElement('tr'),progress=row[6],bar=['partial','fallback'].includes(row[3])?`<span class="progress"><i style="width:${progress}%"></i></span>`:'';tr.innerHTML=`<td class="item"></td><td></td><td><span class="pill ${row[3]}">${localizedText(statusMap[row[3]])}${progress!=null&&['partial','fallback'].includes(row[3])?' '+progress+'%':''}</span>${bar}</td><td class="note"></td>`;tr.children[0].textContent=row[0];tr.children[1].textContent=localizedText({ja:row[1],en:row[2]});tr.children[3].textContent=localizedText({ja:localizedRemarks[row[0]]?.ja||row[4],en:row[5]});body.appendChild(tr)}table.appendChild(body);wrap.appendChild(table);tables.appendChild(wrap)}if(!tables.children.length)tables.innerHTML=`<p>${lang==='ja'?'条件に一致する項目はありません。':'No items match the current filters.'}</p>`;const summary=document.querySelector('#summary');summary.innerHTML='';for(const key of Object.keys(statusMap)){const card=document.createElement('div');card.className='card';card.innerHTML=`<b>${counts[key]}</b><span>${localizedText(statusMap[key])}</span>`;summary.appendChild(card)}}
function updateCopy(){document.documentElement.lang=lang;document.querySelector('#ja').classList.toggle('active',lang==='ja');document.querySelector('#en').classList.toggle('active',lang==='en');document.querySelector('#lead').textContent=lang==='ja'?'WinMUGENをCanonical（正本）とし、MUGEN 1.0／1.1は直前バージョンからの差分だけを管理します。':'WinMUGEN is canonical. MUGEN 1.0 and 1.1 track only differences from the preceding version.';document.querySelector('#inheritance').textContent=localizedText(matrixProfiles[activeProfile].relation);document.querySelector('#foot').textContent=lang==='ja'?'継承構造: WinMUGEN → MUGEN 1.0差分 → MUGEN 1.1差分。共通項目は正本または直前レイヤーで一度だけ管理します。':'Inheritance: WinMUGEN → MUGEN 1.0 delta → MUGEN 1.1 delta. Shared items are maintained once in the canonical or preceding layer.';document.querySelector('#status').options[0].text=lang==='ja'?'全ステータス':'All statuses';rebuildSectionFilter();render()}
function setLang(next){lang=next;updateCopy()}
async function selectProfile(profile){activeProfile=profile;for(const button of document.querySelectorAll('#profile-tabs button')){const active=button.dataset.profile===profile;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))}document.querySelector('#section').value='all';if(!matrixCache.has(profile)){const response=await fetch(matrixProfiles[profile].source,{cache:'no-store'});if(!response.ok)throw Error(`${response.status} ${response.statusText}`);const parsed=parse(await response.text());if(!parsed.length)throw Error(`${matrixProfiles[profile].label} Matrix rows could not be parsed`);matrixCache.set(profile,parsed)}sections=matrixCache.get(profile);updateCopy()}
function init(){const status=document.querySelector('#status');for(const[key,value]of Object.entries(statusMap))status.add(new Option(value.ja,key));const tabs=document.querySelector('#profile-tabs');for(const[key,profile]of Object.entries(matrixProfiles)){const button=document.createElement('button');button.type='button';button.dataset.profile=key;button.textContent=profile.label;button.setAttribute('role','tab');button.onclick=()=>selectProfile(key).catch(showError);tabs.appendChild(button)}document.querySelector('#q').oninput=render;status.onchange=render;document.querySelector('#section').onchange=render;document.querySelector('#ja').onclick=()=>setLang('ja');document.querySelector('#en').onclick=()=>setLang('en')}
function showError(error){document.querySelector('#tables').innerHTML=`<div class="error">Compatibility Matrix load failed: ${String(error.message||error)}</div>`;console.error(error)}
init();selectProfile('winmugen').catch(showError);
</script>
</body>
</html>
