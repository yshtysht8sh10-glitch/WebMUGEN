name: Localize Matrix Remarks Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/localize-matrix-remarks-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Japanese remarks localization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/webmugen/winmugen-compatibility-matrix.html')
          text = path.read_text(encoding='utf-8')

          marker = "function labelStatus(s,progress){return statuses[s][lang]+(['partial','fallback'].includes(s)?` ${progress}%`:'')}"
          if 'function translateRemarkToJapanese(' not in text:
              translator = r'''function translateRemarkToJapanese(note){
  if(!note)return '';
  const exact={
    'Not implemented.':'未実装です。',
    'No implementation evidence.':'実装を裏付ける根拠がありません。',
    'Parser only.':'パーサー対応のみです。',
    'Safe no-op.':'安全な no-op として処理します。',
    'MUGEN 1.0; tracked to prevent later-version or pseudo-trigger syntax from being mixed into the WinMUGEN scope.':'MUGEN 1.0 の機能です。後期バージョンや疑似 Trigger の構文が WinMUGEN 対象へ混入しないよう追跡しています。',
    'MUGEN 1.1; tracked to prevent later-version or pseudo-trigger syntax from being mixed into the WinMUGEN scope.':'MUGEN 1.1 の機能です。後期バージョンや疑似 Trigger の構文が WinMUGEN 対象へ混入しないよう追跡しています。'
  };
  if(exact[note])return exact[note];
  let result=note;
  const phrases=[
    ['Implemented:','実装済み:'],['Missing:','未対応:'],['Evidence:','根拠:'],
    ['Current implementation:','現在の実装:'],['Current behavior:','現在の動作:'],
    ['Not implemented:','未実装:'],['Unsupported:','非対応:'],['Fallback:','代替実装:'],
    ['Partial implementation','一部実装'],['focused tests','focused test'],['focused test','focused test'],
    ['real-character confirmation','実キャラクターでの確認'],['real-character execution','実キャラクターでの実行'],
    ['real-game confirmation','実ゲームでの確認'],['real-game execution','実ゲーム経路での実行'],
    ['runtime path','ランタイム経路'],['production runtime','実ゲーム用ランタイム'],
    ['current evaluator','現在の評価器'],['compiled evaluator','コンパイル済み評価器'],
    ['legacy evaluator','旧評価器'],['runtime integration','ランタイム統合'],
    ['entity ownership','Entity 所有権'],['ownership','所有権'],['redirects','Redirect'],['redirect','Redirect'],
    ['pause timing','Pause 中の更新タイミング'],['pause behavior','Pause 中の挙動'],
    ['WinMUGEN semantics','WinMUGEN 仕様'],['WinMUGEN timing','WinMUGEN のタイミング'],
    ['WinMUGEN parity','WinMUGEN 同等性'],['compatibility','互換性'],
    ['The current evaluator has a runtime path for the documented subset.','現在の評価器には、文書化された範囲を処理するランタイム経路があります。'],
    ['strict Issue #82 Complete evidence across arguments, Redirect, Entity ownership, Pause timing, and real-character execution.','引数、Redirect、Entity 所有権、Pause 中の更新タイミング、実キャラクターでの実行を横断した Issue #82 の厳密な Complete 根拠。'],
    ['strict Issue #82 Complete evidence across arguments, redirects, entity ownership, pause timing, and real-character execution.','引数、Redirect、Entity 所有権、Pause 中の更新タイミング、実キャラクターでの実行を横断した Issue #82 の厳密な Complete 根拠。'],
    ['machine-readable inventory','機械可読の実装一覧'],['current implementation','現在の実装'],
    ['focused-test audit','focused test の監査'],['focused test audit','focused test の監査'],
    ['broader redirected/entity execution','より広い Redirect／Entity 実行'],
    ['remaining WinMUGEN semantics not identified as covered by this row','この行で対応済みと確認できていない残りの WinMUGEN 仕様'],
    ['current implemented behavior','現在実装されている動作'],['runtime inventory','ランタイム実装一覧'],
    ['focused-test inventory','focused test 一覧'],['safe defaults','安全な既定値'],
    ['diagnosed safe defaults','診断ログ付きの安全な既定値'],['remains incomplete','は未完成です'],
    ['remain incomplete','は未完成です'],['remains Partial','は Partial のままです'],
    ['remain Partial','は Partial のままです'],['still needs audit','は引き続き監査が必要です'],
    ['needs audit','は監査が必要です'],['pending','未対応'],['not available','利用できません'],
    ['not supported','対応していません'],['unsupported','非対応'],['complete','完了'],
    ['including','（以下を含む）'],['across','を横断して'],['through','を通じて'],
    ['with optional','オプションの'],['when provided','指定されている場合'],
    ['returns','を返します'],['reads','を参照します'],['evaluates','を評価します'],
    ['uses','を使用します'],['supports','に対応します'],['applies','を適用します'],
    ['prevents','を防止します'],['preserves','を保持します'],['resets','をリセットします'],
    ['counts','を数えます'],['selects','を選択します'],['measures','を計測します'],
    ['from the current player','現在のプレイヤーから'],['for the current root','現在の Root に対して'],
    ['both Facings','左右両方の Facing'],['P1/P2','P1／P2'],['Helper','Helper'],['Root','Root'],
    ['State changes','State 遷移'],['State change','State 遷移'],['same-frame','同一フレーム'],
    ['one-unpaused-tick','Pause されていない1 tick'],['elapsed-time','経過時間'],
    ['invalid','無効な'],['missing','存在しない'],['current','現在の'],['exact','厳密な'],
    ['broader','より広い'],['remaining','残りの'],['behavior','挙動'],['timing','タイミング'],
    ['tests','テスト'],['test','テスト'],['implementation','実装'],['documented','文書化された'],
    ['arguments','引数'],['expression','式'],['values','値'],['value','値'],['result','結果'],
    ['character','キャラクター'],['player','プレイヤー'],['opponent','相手'],['background','背景'],
    ['animation','アニメーション'],['velocity','速度'],['position','座標'],['distance','距離'],
    ['collision','衝突判定'],['contact','接触'],['guard','ガード'],['hit','ヒット'],
    ['round','ラウンド'],['team','チーム'],['owner','所有者'],['source','参照元']
  ];
  for(const [en,ja] of phrases)result=result.split(en).join(ja);
  return result;
}'''
              if marker not in text:
                  raise SystemExit('labelStatus marker was not found')
              text = text.replace(marker, translator + '\n' + marker, 1)

          old = "<td class=\"note\">'+(lang==='ja'?r[4]:r[5])+'</td>"
          new = "<td class=\"note\">'+(lang==='ja'?translateRemarkToJapanese(r[4]||r[5]):r[5])+'</td>"
          if old not in text and new not in text:
              raise SystemExit('remarks render expression was not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/localize-matrix-remarks-once.yml
      - name: Commit generated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/webmugen/winmugen-compatibility-matrix.html .github/workflows/localize-matrix-remarks-once.yml
          git commit -m "Localize compatibility matrix remarks in Japanese"
          git push
